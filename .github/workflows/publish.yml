name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Gate on the contract test before anything is published. Built for the
      # runner's own arch so the test can actually execute the image.
      - name: Build for test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.minio
          load: true
          tags: safebucket-railway-minio:test

      - name: Contract test
        run: ./test/minio_test.sh safebucket-railway-minio:test

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Railway runs amd64; arm64 is included so the image stays usable locally
      # on Apple silicon.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.minio
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/safebucket-railway-minio:latest
            ghcr.io/${{ github.repository_owner }}/safebucket-railway-minio:${{ github.sha }}

# ponytail: FROM digest is bumped by hand, same as buzz-railway. Automate with a
# scheduled bump PR when the cadence gets annoying.
